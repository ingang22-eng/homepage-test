<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>1st SCIENCE LAB</title>
</head>
<body style="margin:0;background:#f6f7f9">
<div id="tm2-learn" style="padding:72px 20px;text-align:center;color:#55606e;font:500 15px/1.7 'Noto Sans KR',sans-serif">
<p id="tm2-learn-m" style="margin:0">불러오는 중입니다…</p>
<p id="tm2-learn-h" style="margin:22px 0 0;display:none"><a href="./" style="display:inline-block;padding:13px 24px;border-radius:999px;background:#0F4C81;color:#fff;text-decoration:none;font-weight:700;font-size:14px">홈페이지로 가기</a></p>
</div>
<script>
/* Science Trackman 2.0 — 주소로 여는 화면 : 학습 페이지(수업 영상 찾기 · 개념 노트 · 영상 보기) · 성적표 · 월말 평가 · 짧은 주소(알림톡 버튼).
   서버가 운영과 같은 화면을 만들어 주고, 여기서는 받아서 그대로 펼친다.
   다른 스크립트와 이름이 겹치지 않도록 이 문서에는 이 스크립트 하나만 둔다. */
(function () {
  var URL_ = 'https://rdxbheyraubmqkuzejcj.supabase.co/functions/v1/manage', ADMIN_ = 'https://rdxbheyraubmqkuzejcj.supabase.co/functions/v1/admin';
  var q = new URLSearchParams(location.search), b = { action: 'learnPage' };
  /* 성적표(?report=) · 월말 평가(?mr=) — admin 서버 함수가 만든다 */
  if (q.get('report') !== null) { b = { action: 'reportPage', report: q.get('report') }; URL_ = ADMIN_; }
  else if (q.get('mr') !== null) { b = { action: 'monthPage', mr: q.get('mr') }; URL_ = ADMIN_; }
  /* 짧은 주소(?a=) — 알림톡 버튼. admin 이 적어 둔 화면을 만든다. 영상 화면이면 넘길 값(watch)만 주므로 manage 에 한 번 더 묻는다 */
  else if (q.get('a') !== null) { b = { action: 'shortPage', a: q.get('a') }; URL_ = ADMIN_; }
  else ['p', 'k', 't', 'm', 'v', 'token'].forEach(function (n) { var x = q.get(n); if (x !== null) b[n] = x; });
  function fail(msg) {
    document.getElementById('tm2-learn-m').textContent = msg;
    document.getElementById('tm2-learn-h').style.display = '';
  }
  if (b.action === 'learnPage' && !b.p) { fail('주소가 올바르지 않습니다.'); return; }
  var MANAGE_ = URL_ === ADMIN_ ? ADMIN_.replace(/admin$/, 'manage') : URL_;
  /* 여러 명이 같은 순간에 열어 서버가 잠깐 못 받으면(5xx · 연결 끊김) 조금 뒤 두 번까지 다시 묻는다 — 여기서 부르는 것은 모두 읽기다 */
  function ask(url, body, n) {
    n = n === undefined ? 2 : n;
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { if (r.status >= 500 && n > 0) throw new Error('again'); return r.json(); })
      .catch(function (e) { if (n > 0) return new Promise(function (ok) { setTimeout(ok, 700 + Math.floor(Math.random() * 600)); }).then(function () { return ask(url, body, n - 1); }); throw e; });
  }
  ask(URL_, b)
    .then(function (j) {
      if (b.action === 'shortPage' && j && j.success && j.data && typeof j.data.watch === 'string') return ask(MANAGE_, { action: 'learnPage', p: 'watch', k: j.data.watch });
      return j;
    })
    .then(function (j) {
      if (!j || !j.success || !j.data || typeof j.data.html !== 'string') { fail((j && j.message) || '페이지를 불러오지 못했습니다.'); return; }
      var title = j.data.title;
      document.open(); document.write(j.data.html); document.close();
      if (title) document.title = title;
    })
    .catch(function () { fail('페이지를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 열어 주세요.'); });
})();
</script>
</body>
</html>
